openapi: 3.1.0
info:
  title: Axis API
  version: 1.1.0
  description: |
    Axis 백엔드 API 명세.

    ## 공통 규약
    - 모든 응답에 `x-request-id` 헤더가 붙는다 (서버 로그와 교차 추적용).
    - 레이트 리밋이 걸린 라우트는 성공 시 `X-RateLimit-Remaining` / `X-RateLimit-Reset`,
      초과 시 `429` + `Retry-After`를 반환한다.
    - 에러 바디는 `{ error, code, requestId }` 형태. `error`는 사람이 읽는 메시지(기존
      클라이언트 계약 그대로), `code`는 기계가 분기할 안정적인 식별자.
    - 인증은 Supabase 세션 쿠키(웹) 또는 `Authorization: Bearer <access_token>`(모바일/외부).
servers:
  - url: https://axis-app-beta.vercel.app
    description: production
  - url: http://localhost:3000
    description: local dev

tags:
  - name: compare
  - name: history
  - name: share
  - name: price
  - name: watch
  - name: ops

paths:
  /api/compare:
    post:
      tags: [compare]
      summary: 옵션 2~6개를 비교해 AI 결정 결과를 반환
      description: |
        `options[]` / `optionA`+`optionB` / `query`(자연어) 세 가지 입력 형태를 지원.
        로그인 상태면 결과가 히스토리에 저장되고 `comparisonId`가 함께 반환된다.
        레이트 리밋: 20회/분/IP.
      security: [{}, { supabaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: array
                  items: { type: string, maxLength: 100 }
                  maxItems: 6
                optionA: { type: string, maxLength: 100 }
                optionB: { type: string, maxLength: 100 }
                query: { type: string, description: "자연어 비교 쿼리 (예: 아이폰 16 vs 갤럭시 S25)" }
                context: { type: string, maxLength: 200, description: "맞춤 재분석용 사용자 상황" }
      responses:
        "200":
          description: 비교 결과
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: { $ref: "#/components/schemas/ComparisonResult" }
                  comparisonId: { type: string, description: "로그인 시에만 존재" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/history:
    get:
      tags: [history]
      summary: 비교 히스토리 (커서 페이지네이션)
      description: |
        비로그인 호출은 빈 목록을 반환한다(soft-auth). `nextCursor`가 null이 아니면
        다음 페이지가 존재하며, 그대로 `cursor` 파라미터에 넘기면 된다.
      security: [{}, { supabaseBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: cursor
          in: query
          schema: { type: string, description: "이전 응답의 nextCursor (opaque)" }
      responses:
        "200":
          description: 히스토리 페이지
          content:
            application/json:
              schema:
                type: object
                required: [history, nextCursor]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryItem" }
                  nextCursor:
                    type: [string, "null"]
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/history/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [history]
      summary: 저장된 비교 1건 조회 (소유자만)
      security: [{ supabaseBearer: [] }]
      responses:
        "200":
          description: 저장된 비교
          content:
            application/json:
              schema:
                type: object
                required: [query, result]
                properties:
                  query: { type: string }
                  result: { $ref: "#/components/schemas/ComparisonResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [history]
      summary: 저장된 비교 1건 삭제 (소유자만)
      security: [{ supabaseBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/share/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [share]
      summary: 공유 토큰 발급 (멱등 — 이미 있으면 기존 토큰 반환)
      description: 토큰은 CSPRNG 기반 22자 URL-safe 문자열 (~131bit).
      security: [{ supabaseBearer: [] }]
      responses:
        "200":
          description: 공유 토큰
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/share/guest:
    post:
      tags: [share]
      summary: 비로그인 결과 공유 (익명 public row 저장)
      description: 레이트 리밋 10회/분/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, result]
              properties:
                query: { type: string, minLength: 3, maxLength: 120 }
                result: { $ref: "#/components/schemas/ComparisonResult" }
      responses:
        "200":
          description: 공유 토큰
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/price:
    get:
      tags: [price]
      summary: 검증된 제품의 가격 스냅샷
      description: |
        카탈로그에 없는 제품이거나 가격 소스가 미설정이면 `{ result: null }`.
        가격을 지어내지 않는다 — 스펙 검증 게이트와 같은 정직성 규칙.
      parameters:
        - name: id
          in: query
          schema: { type: string, description: "제품 id (name보다 우선)" }
        - name: name
          in: query
          schema: { type: string, description: "제품명 (id 없을 때)" }
        - name: locale
          in: query
          schema: { type: string, enum: [ko, en, ja], description: "미설정/무효 시 en" }
      responses:
        "200":
          description: 가격 스냅샷 (또는 result null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    oneOf:
                      - { $ref: "#/components/schemas/PriceResult" }
                      - { type: "null" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/watches:
    get:
      tags: [watch]
      summary: 내 관심 상품 목록
      security: [{ supabaseBearer: [] }]
      responses:
        "200":
          description: 관심 상품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items: { $ref: "#/components/schemas/WatchRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [watch]
      summary: 관심 상품 등록/갱신 (멱등 upsert)
      description: 소유자는 항상 세션 이메일 — body의 email 필드는 무시된다.
      security: [{ supabaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, name, region]
              properties:
                productId: { type: string, maxLength: 200 }
                name: { type: string, maxLength: 300 }
                region: { $ref: "#/components/schemas/Region" }
                targetPrice: { type: number, minimum: 0 }
                addedAt: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [watch]
      summary: 관심 상품 삭제
      security: [{ supabaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, region]
              properties:
                productId: { type: string }
                region: { $ref: "#/components/schemas/Region" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/push/subscribe:
    post:
      tags: [watch]
      summary: 웹푸시 가격 알림 등록
      description: |
        로그인 불필요 — 브라우저가 발급한 푸시 subscription 자체가 자격 증명.
        레이트 리밋 30회/분/IP가 1차 남용 방어선.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription, productId, name, region]
              properties:
                subscription:
                  type: object
                  description: "PushSubscription.toJSON() 결과 (endpoint 필수)"
                  required: [endpoint]
                productId: { type: string }
                name: { type: string }
                region: { $ref: "#/components/schemas/Region" }
                targetPrice: { type: number, minimum: 0 }
                addedAt: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [watch]
      summary: 웹푸시 가격 알림 해제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, productId, region]
              properties:
                endpoint: { type: string }
                productId: { type: string }
                region: { $ref: "#/components/schemas/Region" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/track:
    post:
      tags: [ops]
      summary: 클릭/뷰 이벤트 수집 (fire-and-forget)
      description: |
        의도된 계약 특성 — 트래킹은 사용자 플로우를 절대 깨지 않으므로 JSON 파싱 실패,
        DB 실패에도 `{ ok: true }`를 반환한다. 하드 4xx는 레이트 리밋(429)과
        알 수 없는 event_type(400)뿐.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: { type: string, enum: [affiliate, compare_view] }
                product_id: { type: string }
                slug: { type: string }
                region: { type: string }
                retailer: { type: string }
                session_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: 알 수 없는 event_type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: invalid_event }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/health:
    get:
      tags: [ops]
      summary: 헬스체크 (readiness)
      description: |
        DB 왕복 프로브 + 기능별 설정 여부를 한 번에 보고한다.
        완전 가동이면 200, 저하 상태면 503 (업타임 모니터가 non-2xx에 알림).
        환경변수 "이름"만 노출하며 값은 절대 노출하지 않는다.
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 저하 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/cron/price-check:
    get:
      tags: [ops]
      summary: "[cron] 가격 알림 평가 + 발송"
      security: [{ cronBearer: [] }]
      responses:
        "200":
          description: 실행 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailChecked: { type: integer }
                  pushChecked: { type: integer }
                  fired: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/price-snapshot:
    get:
      tags: [ops]
      summary: "[cron] 일일 KR 가격 스냅샷 적재 (멱등 upsert)"
      security: [{ cronBearer: [] }]
      responses:
        "200":
          description: 실행 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  provider: { type: string }
                  stored: { type: integer }
                  failed: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      description: Supabase access token. 웹은 세션 쿠키로도 동일하게 인증된다.
    cronBearer:
      type: http
      scheme: bearer
      description: CRON_SECRET. 서버가 constant-time 비교로 검증.

  responses:
    Ok:
      description: 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, const: true }
    BadRequest:
      description: 잘못된 요청 (JSON 파싱 실패 / 검증 실패)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 레이트 리밋 초과
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도 가능까지 남은 초
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: 의존성 미설정/불능
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: 서버 오류 (내부 정보는 로그에만 남고 클라이언트에는 노출되지 않음)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 메시지 (기존 클라이언트 계약 그대로)
        code:
          type: string
          enum: [bad_request, validation_failed, unauthorized, forbidden, not_found, conflict, rate_limited, service_unavailable, internal_error]
        requestId:
          type: string
          description: 서버 로그 교차 추적용 UUID
        details:
          description: 안전하게 노출 가능한 구조화 상세 (예: 검증 이슈 목록)

    Region:
      type: string
      enum: [US, KR, JP]

    HistoryItem:
      type: object
      required: [id, query, selected_option, created_at]
      properties:
        id: { type: string, format: uuid }
        query: { type: string }
        selected_option: { type: string }
        created_at: { type: string, format: date-time }

    ComparisonResult:
      type: object
      description: 결정 엔진 출력. 상세 스키마는 lib/types.ts의 ComparisonResult가 단일 소스.
      required: [selectedOption, category]
      properties:
        status: { type: string }
        category: { type: string }
        selectedOption: { type: string }
        oneLineConclusion: { type: string }
      additionalProperties: true

    PriceResult:
      type: object
      required: [productId, name, region, currency, current, lowest, average, dealScore, url, source, spark]
      properties:
        productId: { type: string }
        name: { type: string }
        region: { $ref: "#/components/schemas/Region" }
        currency: { type: string }
        current: { type: number }
        lowest: { type: number }
        average: { type: number }
        dealScore: { type: number, minimum: 0, maximum: 1 }
        url: { type: string, format: uri }
        source: { type: string }
        spark:
          type: array
          items: { type: number }
          description: 과거→현재 순 가격 (스파크라인용)

    WatchRow:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        region: { $ref: "#/components/schemas/Region" }
        target_price: { type: [number, "null"] }
        added_at: { type: string, format: date-time }
        last_notified_price: { type: [number, "null"] }
        last_notified_at: { type: [string, "null"], format: date-time }

    Health:
      type: object
      required: [status, requestId, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        requestId: { type: string }
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status: { type: string, enum: [ok, error, unconfigured] }
                latencyMs: { type: integer }
            ai:
              type: object
              properties:
                configured: { type: boolean }
            pricing:
              type: object
              properties:
                provider: { type: [string, "null"] }
            email:
              type: object
              properties:
                configured: { type: boolean }
            push:
              type: object
              properties:
                configured: { type: boolean }
        missingCoreEnv:
          type: array
          items: { type: string }
          description: 미설정된 핵심 환경변수 "이름" 목록 (값은 절대 노출 안 됨)
